# Copy to config/<client>.yaml and fill in values.
client:
  name: "demo-client"
  region: "asia-south1"  # Mumbai — India region

stack:
  type: matomo
  url: "https://analytics.example.com"
  site_id: 1
  api_token: "${MATOMO_API_TOKEN}"

ga4:
  property_id: "123456789"
  measurement_id: "G-XXXXXXXX"
  credentials_file: "credentials/ga-service-account.json"

gtm:
  account_id: "1234567"
  container_id: "7654321"
  credentials_file: "credentials/ga-service-account.json"

dpdp:
  # DPDP-ready defaults — not "compliant" (depends on client processes)
  require_consent: true
  cmp_provider: "klaro"  # klaro | cookiebot | osano
  data_retention_days: 365
  pii_scrub_enabled: true
  audit_log_enabled: true
  demo_user_id: "oydk-align-001"

parity:
  use_fixture: false
  fixture_file: "agents/parity/fixtures/aurablush_parity.json"
  schedule_migration: "0 6 * * *"   # daily at 6 AM during migration
  schedule_steady: "0 6 * * 1"      # weekly on Monday after cutover
  target_gap_percent: 5
  metrics:
    - users
    - sessions
    - key_events
    - traffic_sources
  key_events:
    - purchase
    - add_to_cart
    - sign_up
  email_daily_report: true
  alert_emails:
    - analytics-owner@client.com
    - analytics-team@client.com
  alert_slack_webhook: "${SLACK_WEBHOOK_URL}"

connectors:
  demo_mode: true
  google_ads:
    customer_id: "1234567890"
    conversion_action_id: "987654321"
  meta:
    pixel_id: "1234567890"
    access_token: "${META_ACCESS_TOKEN}"
  bigquery:
    project_id: "client-gcp-project"
    dataset: "matomo_export"
    table: "events"
    connector_table: "connector_conversions"
  looker:
    dashboard_id: "matomo-marketing-overview"

history:
  import_limit: 5000
  throttle_ms: 0
  mirror_to_warehouse: false
  warehouse_table: ga4_history_import
  ga4_bigquery:
    project_id: "client-gcp-project"
    dataset: "analytics_123456789"  # GA4 BQ export: analytics_<property_id>
  fixture_file: agents/history/fixtures/sample_ga4_bq_rows.json

migration:
  gtm_draft_only: true  # NEVER auto-publish GTM changes
  output_dir: "output/migration"
  use_fixture: false
  fixture_dir: "agents/migration/fixtures"
  fixture_ga4: "aurablush_ga4.json"
  fixture_gtm: "aurablush_gtm.json"
