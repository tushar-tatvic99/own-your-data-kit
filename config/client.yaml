client:
  name: "aurablush"
  region: "asia-south1"
  website_url: "https://auraandblush-61760469326.asia-south1.run.app"

stack:
  type: matomo
  url: "https://matomo.35-234-210-199.nip.io"
  site_id: 1
  api_token: "${MATOMO_API_TOKEN}"

ga4:
  # Numeric property ID (Admin URL …/p560630351/…), not Cloud Run or G- measurement ID
  property_id: "560630351"
  credentials_file: "credentials/ga-service-account.json"

gtm:
  # From tagmanager.google.com URL accountId=…&containerId=… (numeric container ID for API)
  account_id: "6399646488"
  container_id: "283402441"
  credentials_file: "credentials/ga-service-account.json"

dpdp:
  require_consent: true
  cmp_provider: "cookieconsent"
  data_retention_days: 365
  pii_scrub_enabled: true
  audit_log_enabled: true

parity:
  schedule_migration: "0 6 * * *"
  schedule_steady: "0 6 * * 1"
  target_gap_percent: 5
  metrics:
    - users
    - sessions
    - key_events
    - traffic_sources
  key_events:
    - purchase
    - add_to_cart
    - financial_lead_submitted
    - calculate_loan_emi
    - calculate_fd_yield
  email_daily_report: true
  alert_emails:
    - mohit@tatvic.com
    - tushar@tatvic.com
    - parshwa@tatvic.com
    - dhruvi.p@tatvic.com
    - prakash.katariya@tatvic.com
  alert_slack_webhook: ""

connectors:
  demo_mode: false
  google_ads:
    customer_id: "1112110147"
    conversion_action_id: "7868766365"
    conversion_name: "tvc_synminds_ecom_web (web) purchase"
    credentials_file: "credentials/google-ads.yaml"
  bigquery:
    project_id: "tvc-int-matomo"
    dataset: "matomo_export"
    table: "events"
    conversions_table: "connector_conversions"
  looker:
    dashboard_id: "matomo-marketing-overview"

migration:
  gtm_draft_only: true
  output_dir: "output/migration"

# GA4 → BigQuery export (NOT matomo_export). Link in GA4 Admin → Product links → BigQuery.
history:
  import_limit: 100
  ga4_bigquery:
    project_id: "tvc-int-matomo"
    dataset: "analytics_560630351"
    location: "asia-south1"
  fixture_file: "agents/history/fixtures/sample_ga4_bq_rows.json"
